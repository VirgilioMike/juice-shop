name: Security CI - Juice Shop (SCA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sca:
    name: SCA – OWASP Dependency-Check (HTML)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          # Preferível em CI quando há package-lock.json
          npm ci || npm install

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "juice-shop"
          path: "."
          format: "HTML"
          out: "dep-check-report"
          args: >
            --exclude "**/test/**"
            --exclude "**/tests/**"
            --exclude "**/test/files/**"
            --exclude "**/build/**"
            --disableArchive

      - name: Upload SCA HTML report
        uses: actions/upload-artifact@v4
        with:
          name: sca-report-html
          path: dep-check-report/dependency-check-report.html
